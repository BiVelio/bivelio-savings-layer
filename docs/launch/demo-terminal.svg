<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1200" height="630" rx="16" fill="#0F1218"/>
  <rect x="0" y="0" width="1200" height="34" rx="16" fill="#1A1F2A"/>
  <circle cx="24" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="17" r="6" fill="#27C93F"/>
  <text x="560" y="23" text-anchor="middle" fill="#8A929E" font-size="13">bvsala — savings layer</text>

  <text x="40" y="80" fill="#27C93F" font-size="16" font-weight="600">$ npm i @bivelio/savings-layer</text>

  <text x="40" y="140" fill="#8A929E" font-size="15">const layer = createSavingsLayer({ provider, tokenizer });</text>
  <text x="40" y="168" fill="#8A929E" font-size="15">const { text, report } = await layer.generate({ model, messages });</text>

  <text x="40" y="240" fill="#E8ECF2" font-size="16" font-weight="600">answer: 12</text>

  <text x="40" y="290" fill="#27C93F" font-size="15">[resolver]        cache=deterministic  llm=0  avoided=1  in=0  out=0   eliminated=0  netSavings=100%</text>
  <text x="40" y="320" fill="#FFBD2E" font-size="15">[first (miss)]    cache=miss           llm=1  avoided=0  in=9  out=10  eliminated=0  netSavings=0%</text>
  <text x="40" y="350" fill="#27C93F" font-size="15">[second (exact)]  cache=exact          llm=0  avoided=1  in=0  out=0   eliminated=0  netSavings=100%</text>

  <rect x="40" y="398" width="1120" height="1" fill="#2A3242"/>

  <text x="40" y="442" fill="#8A929E" font-size="14">Four ledgers, never summed: avoided_calls · eliminated_tokens · compressed_tokens · provider_cached_tokens</text>
  <text x="40" y="472" fill="#8A929E" font-size="14">Every amount labelled measured / reference / estimated — and estimates are never billed.</text>

  <text x="40" y="560" fill="#E8ECF2" font-size="15" font-weight="600">Apache-2.0 · zero dependencies · zero telemetry</text>
  <text x="40" y="592" fill="#4F7DF0" font-size="15">savings.bivelio.com</text>
</svg>
