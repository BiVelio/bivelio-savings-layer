name: compilar-paper

# Compila docs/paper/main.tex a PDF (2 pasadas, latexmk) y lo deja como artefacto
# descargable. Se dispara al tocar docs/paper/** o a mano. El PDF NO se publica
# automáticamente: el dueño lo baja del artefacto y lo sube donde quiera
# (bivelio.com, Zenodo, arXiv).

on:
  push:
    paths:
      - "docs/paper/**"
      - ".github/workflows/compilar-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar paper (LaTeX -> PDF)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/paper
          root_file: main.tex
      # Ninguna línea del PDF se sale del margen. Un \texttt{} con una ruta no
      # se puede partir: en «Data and code availability» una ruta pasaba 257 pt
      # del borde y el PDF solo mostraba «docs/benchmarks/2». LaTeX lo deja en
      # el log como «Overfull \hbox (X pt too wide)»; por encima de 10 pt se
      # ve a simple vista, y entonces el paso falla. test/paper-sin-desbordes
      # ejecuta este mismo script contra logs de ejemplo.
      - name: Ninguna línea se sale del margen (Overfull de más de 10 pt)
        working-directory: docs/paper
        run: |
          if [ ! -f main.log ]; then
            echo "::error::No hay docs/paper/main.log: la compilación no dejó su log."
            exit 1
          fi
          DESBORDES="$({ grep -E '^Overfull \\hbox \([0-9.]+pt too wide\)' main.log || true; } | awk '{ v = $3; gsub(/[(pt]/, "", v); if (v + 0 > 10) print }')"
          if [ -n "$DESBORDES" ]; then
            echo "::error::El PDF tiene líneas que se salen del margen más de 10 pt (usa \\path{} para las rutas):"
            echo "$DESBORDES"
            exit 1
          fi
          echo "ninguna línea se sale del margen más de 10 pt"
      - name: Subir el PDF
        uses: actions/upload-artifact@v4
        with:
          name: bv-sala-paper
          path: docs/paper/main.pdf
          if-no-files-found: error
          retention-days: 90
