name: diagnostico-xstest-351

run-name: diagnostico XSTest 351; no banco

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe 351 para autorizar una única llamada B de diagnóstico"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnostico-xstest-351-apertura
  cancel-in-progress: false

jobs:
  diagnostico:
    if: github.ref == 'refs/heads/diag/xstest-351-apertura' && inputs.confirmar == '351'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Habilitar pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:all
      - name: Una llamada B para XSTest 351
        env:
          BVSALA_DEMO_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BVSALA_DEMO_OPENAI_BASE_URL: https://api.openai.com/v1
          BVSALA_DEV_OPEN: "1"
        run: pnpm exec tsx benchmarks/publicados/xstest/diagnosticar-apertura-351.ts
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-xstest-351
          path: diagnostico-xstest-351/apertura.json
          if-no-files-found: error
          retention-days: 1
