name: ci

# LA VERJA DE TODOS LOS DÍAS. Hasta ahora este repositorio no tenía ninguna: los
# 565 tests solo corrían al cortar una Release (publish.yml), es decir DESPUÉS de
# haber mergeado, y Vercel publica en savings.bivelio.com a los ~40 s de cada push
# a `main`. En la práctica el código llegaba a producción —y al dinero— sin que
# nada lo hubiera ejecutado.
#
# Con esto, más `required_status_checks` en la protección de `main`, la cadena
# queda cerrada: no se puede mergear en rojo, y como a `main` solo se entra por PR,
# lo que Vercel despliega ya ha pasado por aquí.
#
# AHORRO DE MINUTOS (el repositorio es privado: cada minuto se factura, y cada
# trabajo se redondea al minuto entero). Lo que cambia y por qué:
#   - Ya NO corre en push a `main`. A `main` solo se entra por PR con
#     `strict: true`, así que el commit mergeado ya pasó por aquí tal cual; la
#     segunda pasada costaba ~11,6 min por merge para volver a ver lo mismo.
#   - Sin `next build` de apps/web: Vercel construye cada PR (estado «Vercel»
#     en el commit) antes de que llegue a producción. El typecheck y los tests
#     de la web se quedan.
#   - En el PR, una sola versión de Python para pytest (la más nueva que declara
#     el pyproject) y solo si cambia el cliente de Python. La matriz completa
#     corre los domingos, a mano y en cada Release.
on:
  pull_request:
  schedule:
    # Domingos 05:41 UTC: lejos del banco semanal (lunes 04:17). Un workflow
    # programado que falla manda correo al dueño del repositorio.
    - cron: "41 5 * * 0"
  workflow_dispatch:
  release:
    types: [published]

# Un push nuevo sobre el mismo PR cancela el run anterior: no tiene sentido
# gastar minutos verificando un commit que ya está superado. Fuera de los PR no
# se cancela nada (un run programado o de Release se deja terminar).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `verificar` es el ÚNICO check requerido por la protección de `main`, así que
  # corre SIEMPRE en todo PR (sin filtro de rutas a nivel de trabajo: un check
  # requerido que no arranca deja el PR colgado en «Expected»). Lo que depende de
  # rutas se decide paso a paso, dentro. Va en un solo trabajo a propósito: un
  # trabajo aparte de «cambios» y otro agregador costarían 1 min facturado cada
  # uno, más de lo que ahorran los pasos que se saltan.
  #
  # La suite de vitest NO se filtra por rutas: lee docs/, README, los workflows
  # y el cliente de Python (test/cadena-de-suministro, test/python-cliente…),
  # así que casi cualquier cambio puede romperla.
  verificar:
    # En una Release ya verifican publish.yml / publish-pypi.yml; aquí solo
    # corre la matriz de Python.
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lista los archivos del PR por la API
    steps:
      - uses: actions/checkout@v4

      # Fijado por SHA de commit completo (v4.0.3), no por etiqueta movible.
      - name: Qué ha cambiado (solo en PR)
        id: cambios
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - 'packages/python/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Habilitar pnpm (desde packageManager)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # `apps/web` es un PROYECTO APARTE: tiene su propio pnpm-lock.yaml y su
      # propio pnpm-workspace.yaml, y el workspace de la raíz solo incluye
      # packages/* y services/*. Sin este install, 26 tests revientan con
      # "Failed to load url next/server" — pasó de verdad, en el primer intento
      # de publicar. En un portátil no se nota porque apps/web/node_modules
      # lleva ahí desde el primer `pnpm dev`.
      - name: Dependencias de apps/web (lockfile propio)
        run: pnpm install --frozen-lockfile --dir apps/web

      # EL ORDEN IMPORTA: primero construir. `services/*` typechequea contra los
      # TIPOS CONSTRUIDOS de los paquetes del workspace (@bivelio/protocol,
      # @bivelio/license-client), así que sin `build:all` delante falla con
      # "Cannot find module". También pasó de verdad, en el segundo intento.
      - run: pnpm run build:all
      - name: Typecheck (SDK, paquetes y servicios)
        run: pnpm run typecheck:all

      # EL CLIENTE DE PYTHON contra el gateway DE VERDAD: test/python-cliente.test.ts
      # lanza Python desde vitest y, en CI, exige los dos SDK oficiales. Van
      # fijados por versión Y por hash (requirements-ci.txt): lo que se instala
      # aquí es exactamente lo que se revisó, nada que PyPI cambie por debajo.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python — dependencias de prueba (fijadas por hash)
        run: 'python -m pip install --require-hashes --only-binary :all: -r packages/python/requirements-ci.txt'

      - name: Tests
        run: pnpm test

      # `typecheck:all` NO cubre apps/web (no está en el workspace de la raíz),
      # así que hasta ahora el código que COBRA —webhook de Stripe, checkout,
      # emisión de licencias— no lo typechequeaba nadie en CI. Un error de tipos
      # ahí no lo veía nadie hasta que Vercel construía en producción.
      # OJO con la sintaxis: `--dir` va ANTES de `run`. Escrito al revés
      # (`pnpm run typecheck --dir apps/web`) pnpm ejecuta el script de la RAÍZ
      # pasándole `--dir apps/web` como argumentos — typechequea el SDK otra vez
      # y la web se queda sin mirar, que es justo el agujero que esto cierra.
      - name: Typecheck de apps/web (el código que cobra)
        run: pnpm --dir apps/web run typecheck

      # Sin `next build`: lo construye Vercel en cada PR (estado «Vercel»). Ver
      # la cabecera de este archivo.

      # pytest en la versión MÁS NUEVA que declara el pyproject, solo si cambia
      # el cliente de Python (o este workflow). El extremo a extremo con el
      # gateway ya corrió arriba, dentro de `pnpm test`. La más vieja (3.10) va
      # en el trabajo `python`, fuera de los PR.
      - name: Python 3.14 para pytest
        if: ${{ github.event_name != 'pull_request' || steps.cambios.outputs.python == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: pytest 3.14 — dependencias de prueba (fijadas por hash)
        if: ${{ github.event_name != 'pull_request' || steps.cambios.outputs.python == 'true' }}
        run: 'python -m pip install --require-hashes --only-binary :all: -r packages/python/requirements-ci.txt'
      - name: pytest 3.14 (sin red)
        if: ${{ github.event_name != 'pull_request' || steps.cambios.outputs.python == 'true' }}
        run: python -m pytest packages/python -q

  # EL CLIENTE DE PYTHON en la versión más vieja y en la más nueva que declara
  # (pyproject: >=3.10). Solo pytest, sin Node: el extremo a extremo con el
  # gateway va en `verificar`. Las pruebas no tocan la red: conftest.py hace
  # fallar cualquier conexión que no sea a 127.0.0.1.
  #
  # FUERA DE LOS PR: domingos, a mano y en cada Release. En el PR basta la más
  # nueva, que corre dentro de `verificar`. La matriz es la MISMA que la de
  # publish-pypi.yml (test/publicar-pypi.test.ts lo exige).
  python:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias de prueba (fijadas por hash)
        run: 'python -m pip install --require-hashes --only-binary :all: -r packages/python/requirements-ci.txt'
      - name: pytest (sin red)
        run: python -m pytest packages/python -q
