name: persistence-canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: bivelio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Habilitar pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:all
      - name: Backup, restore y benchmark PostgreSQL
        env:
          BIVELIO_TEST_POSTGRES_URL: postgresql://postgres:validation@127.0.0.1:5432/bivelio_test
          BIVELIO_PG_CLIENT_DOCKER: pgvector/pgvector:pg17
          BIVELIO_BENCH_P95_MS: 250
          BIVELIO_BENCH_P99_MS: 500
          BIVELIO_BENCH_MAX_MS: 500
          BIVELIO_BENCH_QUERY_TIMEOUT_MS: 1000
          BIVELIO_BENCH_OUTPUT: persistence-results/semantic-postgres-100k.json
        run: |
          mkdir -p persistence-results
          pnpm --filter @bivelio/persistence-postgres exec vitest run test/disaster-recovery.integration.test.ts
          pnpm run bench:postgres-semantica
      - name: Smoke de las RC instaladas desde npm
        env:
          BVSALA_DEMO_GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANARY_LICENSE_A: ${{ secrets.CANARY_LICENSE_A }}
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-consumer" --ignore-scripts --no-audit --no-fund @bivelio/savings-layer@0.6.0-rc.1 @bivelio/persistence-postgres@0.1.0-rc.1 pg@8.23.1
          npm list --prefix "$RUNNER_TEMP/npm-consumer" --depth=0
          cp scripts/rc-npm-smoke.mjs "$RUNNER_TEMP/npm-consumer/smoke.mjs"
          node "$RUNNER_TEMP/npm-consumer/smoke.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-canary-results
          path: persistence-results/
          if-no-files-found: warn
          retention-days: 90
